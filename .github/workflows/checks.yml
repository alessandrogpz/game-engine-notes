name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  vault:
    name: Links and math
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Relative links break silently whenever a file moves.
      - name: Check links resolve
        run: python3 scripts/check_links.py

      # LaTeX that renders in Obsidian can still fail on GitHub, where an
      # unsupported macro replaces the whole equation with an error box.
      - name: Check math renders on GitHub
        run: python3 scripts/check_math.py

  code:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The runner's default GCC 13 cannot scan C++ module dependencies —
      # CMake needs P1689 dependency scanning, first implemented in GCC 14.
      # Ninja is required for the same reason: Makefiles have no dyndep.
      - name: Install GCC 14 and Ninja
        run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build

      - name: Configure
        run: >
          cmake -S 90_Code -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++-14

      # GCC 14's module cache is racy under parallel builds — "failed to read
      # compiled module cluster / Bad file data". Serial keeps it honest.
      - name: Build
        run: cmake --build build -j 1

      - name: Test
        run: ctest --test-dir build --output-on-failure

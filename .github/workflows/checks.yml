name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The C++ build is deliberately not run here. C++20 modules need a compiler
# newer than the runners ship, and chasing that across toolchain versions cost
# more than it returned — the build is exercised locally on every change. These
# checks are the ones that catch failures which actually recur: links that break
# when a file moves, and LaTeX that renders in Obsidian but not on GitHub.
jobs:
  vault:
    name: Links and math
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Relative links break silently whenever a file moves.
      - name: Check links resolve
        run: python3 scripts/check_links.py

      # LaTeX that renders in Obsidian can still fail on GitHub, where an
      # unsupported macro replaces the whole equation with an error box.
      - name: Check math renders on GitHub
        run: python3 scripts/check_math.py
